name: Yian backend

on:
  push:
    branches: [master-jdk17]
  pull_request:
    branches: [master-jdk17]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build enabled modules
        run: mvn -B -DskipTests package
      - name: Verify AI and material return workflows
        run: >-
          mvn -B -pl yian-module-mes -am test
          -Dtest=YianAiIntegrationControllerTest,YianAiIntegrationServiceImplTest,YianWorkorderMaterialReturnControllerTest,YianWorkorderMaterialReturnServiceImplTest
          -Dsurefire.failIfNoSpecifiedTests=false
